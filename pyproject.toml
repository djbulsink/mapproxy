[project]
name = "mapproxy"
version = "0.4.0"
description = "MapProxy is an open source proxy for geospatial data."
authors = []
requires-python = ">= 3.12"
dependencies = [ 
    "PyYAML (>=3.0,<4.0)", 
    "pyproj>=3", 
    "jsonschema>=4", 
    "werkzeug (>=3,<4)" 
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
